<!DOCTYPE html>
<html>
<head>
    <title>LegalLens - Chat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page">
        <div class="letterhead">
            <div class="wordmark">LegalLens</div>
            <div class="tagline">Chat with your Document</div>
        </div>

        {% for turn in chat_history %}
        <div class="chat-turn">
            <div class="chat-q">You asked: {{ turn.question }}</div>
            <div class="chat-a">
                {{ turn.answer }}
                <div class="chat-sources">
                    Sources
                    <ul>
                        {% for s in turn.sources %}
                        <li>{{ s }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
        {% endfor %}

        <div class="card">
            <form method="post">
                <input type="text" name="question" placeholder="Ask a question about this document...">
                <div class="btn-row">
                    <button type="submit" class="btn">
                        <svg class="sparkle" viewBox="0 0 24 24"><path d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245ZM18,21l1.5,3L21,21l3-1.5L21,18l-1.5-3L18,18l-3,1.5ZM19.333,4.667,20.5,7l1.167-2.333L24,3.5,21.667,2.333,20.5,0,19.333,2.333,17,3.5Z"></path></svg>
                        <span>Ask</span>
                    </button>
                </div>
            </form>
        </div>

        <p><a href="/clear_chat" class="link">Clear Chat</a> &nbsp;·&nbsp; <a href="/" class="link">Back to Home</a></p>
    </div>
</body>
</html>
